[project]
name = "astana-access"
version = "0.1.0"
description = "Spatial accessibility assessment and optimal siting of social infrastructure in Astana"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1",
    "shapely>=2.1",
    "pyogrio>=0.11",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "rioxarray>=0.19",
    "exactextract>=0.2",
    "h3>=4.3",
    "duckdb>=1.4",
    "pandas>=2.3",
    "numpy>=2.2",
    "requests>=2.32",
    "httpx>=0.28",
    "tqdm>=4.67",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "typer>=0.16",
    "python-dotenv>=1.1",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
    "unidecode>=1.4.0",
]

[project.optional-dependencies]
network = [
    "pyrosm>=0.6",
    "osmnx>=2.0",
    "networkx>=3.4",
]
model = [
    "scikit-learn>=1.6",
    "lightgbm>=4.6",
    "catboost>=1.2",
    "shap>=0.47",
    "libpysal>=4.12",
    "esda>=2.7",
    "splot>=1.1",
]
optimize = [
    "pulp>=3.1",
    "highspy>=1.9",
    "ortools>=9.12",
    "pymoo>=0.6",
]
viz = [
    "matplotlib>=3.10",
    "contextily>=1.6",
    "folium>=0.19",
    "pydeck>=0.9",
    "streamlit>=1.44",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "mypy>=1.15",
    "pybtex>=0.26.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astana_access"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
